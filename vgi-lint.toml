# vgi-lint-check configuration for vgi-x12.
#
# The x12 worker is a pure local parser. Every function ships a guaranteed-runnable
# example: the scalars (`x12_version()`, `delimiters(content)`,
# `transaction_type(content)`) run over inline content, and every TABLE function
# (segments, segments_elements, envelope, the shaped read_* views, edifact_*)
# carries an example over an INLINE interchange string — these auto-detect inline
# content by its ISA/UNA/UNB prefix and parse it directly, so the example produces
# rows with no external file (no VGI902). The file-path/glob hot path is exercised
# separately against the committed `data/` fixtures by the repo's SQLLogic E2E
# (make test-sql).
#
# Static metadata rules remain enabled and the suite gates at `info`, with two
# narrowly scoped exceptions for the SDK's COPY-only adapter (see below).
[tool.vgi-lint-check]
select = ["ALL"]
ignore = []
fail_on = "info"

[tool.vgi-lint-check.per_object."x12.main.copy_x12"]
ignore = [
  { code = "VGI311", kind = "domain-exemption", reason = "The SDK exposes COPY FROM as a parameterless table handler, but its source path comes from COPY context. Direct invocation is deliberately rejected; it cannot be a browsable regular table." },
  { code = "VGI504", kind = "tooling-bug", reason = "COPY handlers cannot be called directly. Their executable discovery example filters vgi_copy_formats by handler name; actual FROM/TO behavior is tested in test/sql/copy.test on all transports." },
]

