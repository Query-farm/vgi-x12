  - name: "shaped_850_po"
    reference_sql: "SELECT po1_line_number, po1_product_id FROM x12.main.read_850('ISA*00*          *00*          *ZZ*SENDER         *ZZ*RECEIVER       *240101*1200*^*00501*000000001*0*P*:~GS*XX*SEND*RECV*20240101*1200*1*X*005010~ST*850*0001~BEG*00*SA*PO9988**20240101~N1*ST*ACME WAREHOUSE*92*DC07~PER*BD*JANE BUYER*TE*5551234~PO1*1*10*EA*4.50**VP*WIDGET-A~PO1*2*5*EA*9.99**VP*WIDGET-B~SE*7*0001~GE*1*1~IEA*1*000000001~')"
