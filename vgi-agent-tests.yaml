  - name: "edifact_summary"
    reference_sql: "SELECT transaction_type FROM x12.main.edifact_envelope('UNA:+.? ''UNB+UNOA:1+SENDER+RECEIVER+240101:1200+REF1''UNH+MSG1+ORDERS:D:96A:UN''BGM+220+PO12345+9''DTM+137:20240101:102''NAD+BY+++ACME CORP''UNT+4+MSG1''UNZ+1+REF1''')"
