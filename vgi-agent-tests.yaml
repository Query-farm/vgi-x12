  - name: "shaped_997_ack"
    reference_sql: "SELECT ak2_transaction_control, ak5_status FROM x12.main.read_997('ISA*00*          *00*          *ZZ*SENDER         *ZZ*RECEIVER       *240101*1200*^*00501*000000001*0*P*:~GS*XX*SEND*RECV*20240101*1200*1*X*005010~ST*997*0001~AK1*HC*1~AK2*837*0001~AK3*CLM*22**8~AK4*1*1028*1~AK5*E~AK2*837*0002~AK5*A~AK9*P*2*2*1~SE*10*0001~GE*1*1~IEA*1*000000001~')"
