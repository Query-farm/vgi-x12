  - name: "shaped_999_ack"
    reference_sql: "SELECT ak2_transaction_control, ik5_status FROM x12.main.read_999('ISA*00*          *00*          *ZZ*SENDER         *ZZ*RECEIVER       *240101*1200*^*00501*000000001*0*P*:~GS*XX*SEND*RECV*20240101*1200*1*X*005010~ST*999*0001~AK1*HC*1~AK2*837*0001~IK3*NM1*8**8~IK4*2*1037*7~IK5*R~AK9*R*1*1*0~SE*8*0001~GE*1*1~IEA*1*000000001~')"
    unordered: true
