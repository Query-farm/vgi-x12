    unordered: true
    ignore_column_names: true
  - name: "shaped_270_inquiry"
    reference_sql: "SELECT hl_id, hl_level_code FROM x12.main.read_270('ISA*00*          *00*          *ZZ*SENDER         *ZZ*RECEIVER       *240101*1200*^*00501*000000001*0*P*:~GS*XX*SEND*RECV*20240101*1200*1*X*005010~ST*270*0001~HL*1**20*1~NM1*PR*2*ACME PAYER*****PI*PAYER01~HL*2*1*21*1~NM1*1P*2*PROVIDER GRP*****XX*1444444444~HL*3*2*22*0~NM1*IL*1*DOE*JOHN****MI*MEMBER99~TRN*1*TRACE70*9999999999~EQ*30~SE*10*0001~GE*1*1~IEA*1*000000001~')"
    unordered: true
    ignore_column_names: true
  - name: "shaped_271_response"
    reference_sql: "SELECT hl_id, eb_plan_description FROM x12.main.read_271('ISA*00*          *00*          *ZZ*SENDER         *ZZ*RECEIVER       *240101*1200*^*00501*000000001*0*P*:~GS*XX*SEND*RECV*20240101*1200*1*X*005010~ST*271*0001~HL*1**20*1~NM1*PR*2*ACME PAYER*****PI*PAYER01~HL*2*1*21*1~NM1*1P*2*PROVIDER GRP*****XX*1444444444~HL*3*2*22*0~NM1*IL*1*DOE*JOHN****MI*MEMBER99~TRN*2*TRACE55*9999999999~EB*1*IND*30**GOLD PPO~EB*B*IND*30****27.5~DTP*291*D8*20240101~SE*12*0001~GE*1*1~IEA*1*000000001~')"
